<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>404 - Page not found</title>
  <style>
    * , *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #f4f6fa;
    }

    .container-404 {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
    }

    .icon-404 {
      width: 90px;
      height: 90px;
      margin-bottom: 1.5rem;
    }

    .number {
      font-size: 96px;
      font-weight: 800;
      color: rgba(0, 61, 150, 0.85);
      line-height: 1;
      margin: 0;
    }

    .subtitle {
      font-size: 22px;
      font-weight: 600;
      color: #1a1a1a;
      margin: 0.75rem 0 0.5rem;
    }

    .description {
      font-size: 16px;
      color: #5a5a5a;
      max-width: 420px;
      margin: 0 0 2rem;
      line-height: 1.5;
    }

    @media screen and (max-width: 480px) {
      .number {
        font-size: 64px;
      }
      .subtitle {
        font-size: 18px;
      }
      .description {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container-404">
    <svg class="icon-404" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="11" cy="11" r="7" stroke="rgba(0,61,150,0.85)" stroke-width="1.5" />
      <path d="M20 20L16.5 16.5" stroke="rgba(0,61,150,0.85)" stroke-width="1.5" stroke-linecap="round" />
      <path d="M8 11H14" stroke="rgba(0,61,150,0.4)" stroke-width="1.5" stroke-linecap="round" />
    </svg>
    <p class="number">404</p>
    <p class="subtitle">Page not found</p>
    <p class="description">The page you're looking for doesn't exist or may have been moved. Let's get you back on track.</p>
  </div>
</body>
</html>
