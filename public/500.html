<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>500 - Something went wrong</title>
  <style>
    * , *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #f4f6fa;
    }

    .container-500 {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
    }

    .icon-500 {
      width: 90px;
      height: 90px;
      margin-bottom: 1.5rem;
    }

    .number {
      font-size: 96px;
      font-weight: 800;
      color: rgba(0, 61, 150, 0.85);
      line-height: 1;
      margin: 0;
    }

    .subtitle {
      font-size: 22px;
      font-weight: 600;
      color: #1a1a1a;
      margin: 0.75rem 0 0.5rem;
    }

    .description {
      font-size: 16px;
      color: #5a5a5a;
      max-width: 420px;
      margin: 0 0 2rem;
      line-height: 1.5;
    }

    @media screen and (max-width: 480px) {
      .number {
        font-size: 64px;
      }
      .subtitle {
        font-size: 18px;
      }
      .description {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container-500">
    <svg class="icon-500" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 9V13" stroke="rgba(0,61,150,0.85)" stroke-width="1.5" stroke-linecap="round" />
      <path d="M12 16.5V16.6" stroke="rgba(0,61,150,0.85)" stroke-width="1.5" stroke-linecap="round" />
      <path d="M10.29 3.86L1.82 18a1 1 0 0 0 .86 1.5h18.64a1 1 0 0 0 .86-1.5L13.71 3.86a1 1 0 0 0-1.72 0Z" stroke="rgba(0,61,150,0.85)" stroke-width="1.5" stroke-linejoin="round" />
    </svg>
    <p class="number">500</p>
    <p class="subtitle">Something went wrong</p>
    <p class="description">We're having trouble on our end. Please try again in a moment.</p>
  </div>
</body>
</html>
